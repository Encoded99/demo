<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Screens Demonstration</title>
  <style>
   body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

h1 {
    text-align: center;
    color: #222;
    font-size: 2rem;
    margin-bottom: 30px;
}

#screens {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.screen {
    width: 100%;
    max-width: 500px;
    background: white;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 30px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

.number {
    color: #2563eb;
    font-size: 1.2rem;
    font-weight: bold;
    margin-bottom: 12px;
}

.screen h2 {
    font-size: 1.8rem;
    color: #222;
    margin-bottom: 15px;
}

.screen p {
    font-size: 1.2rem;
    line-height: 1.7;
    color: #555;
    margin-bottom: 20px;
}

.screen img {
    width: 100%;
    max-width: 320px;
    border-radius: 12px;
    display: block;
    margin: 0 auto;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
}

/* Mobile */
@media (max-width: 600px) {

    body {
        padding: 15px;
    }

    h1 {
        font-size: 2.2rem;
    }

    .screen {
        padding: 20px;
      
    }

    .number {
        font-size: 1.4rem;
    }

    .screen h2 {
        font-size: 2rem;
    }

    .screen p {
        font-size: 1.35rem;
        line-height: 1.8;
    }

    .screen img {
        max-width: 280px;
    }
}
  </style>
</head>
<body>
  <h1>App Screens Demonstration</h1>
  <div id="screens"></div>

  <script>
    // Array of screens: title, description, image
  const screens = [



 {
    title: "Onboarding",
    description: "Welcome screens introducing the RocoCoin platform features to new users before they register or sign in.",
    image: "./image/Screenshot_20260725_163418_rocoCoin.jpg"
  },
  {
    title: "Sign In",
    description: "Login screen where existing users enter their email and password to access their account.",
    image: "./image/Screenshot_20260725_163424_rocoCoin.jpg"
  },
  {
    title: "Register",
    description: "New user registration screen for entering username, email, password and referral code.",
    image: "./image/Screenshot_20260725_163440_rocoCoin.jpg"
  },
  {
    title: "Confirm Email (OTP)",
    description: "Email verification screen where users enter the OTP code sent to their email after registration.",
    image: "./image/Screenshot_20260725_164108_rocoCoin.jpg"
  },
  {
    title: "Create PIN",
    description: "Screen where users set a 4-digit security PIN used to authorize transactions within the app.",
    image: "./image/Screenshot_20260725_163930_rocoCoin.jpg"
  },
  {
    title: "Confirm PIN",
    description: "PIN confirmation screen where users re-enter their chosen PIN to verify it was entered correctly.",
    image: "./image/Screenshot_20260725_163930_rocoCoin.jpg"
  },
  
 
 

  {
    title: "Dashboard",
    description: "Main home screen showing portfolio balance, transaction history, all assets, and quick action buttons for Deposit, Buy, Sell, Withdraw and Swap.",
    image: "./image/Screenshot_20260725_162603_rocoCoin.jpg"
  },
  {
    title: "Transactions",
    description: "Full transaction history tab showing all blockchain transfers with currency, transaction ID and amount.",
    image: "./image/Screenshot_20260725_162615_rocoCoin.jpg"
  },
  
 
  {
    title: "P2P ROCO Trading",
    description: "Peer-to-peer marketplace to buy and sell ROCO tokens. Lists active trades with seller info, rate and limits.",
    image: "./image/Screenshot_20260725_162645_rocoCoin.jpg"
  },
  {
    title: "Staking",
    description: "Stake ROCO tokens in staking pools to earn APY rewards. Shows pool details, lock period and estimated returns.",
    image: "./image/Screenshot_20260725_162708_rocoCoin.jpg"
  },
  
 
  {
    title: "Deposit",
    description: "Deposit funds via Bank Transfer, Crypto Deposit or P2P. Withdraw via Bank or Crypto to external wallet.",
    image: "./image/Screenshot_20260725_162732_rocoCoin.jpg"
  },
   {
    title: "Withdraw",
    description: "Deposit funds via Bank Transfer, Crypto Deposit or P2P. Withdraw via Bank or Crypto to external wallet.",
    image: "./image/Screenshot_20260725_162745_rocoCoin.jpg"
  },
  {
    title: "Gift Card Marketplace",
    description: "Buy and sell gift cards (Netflix, Apple, Steam etc.) using ROCO tokens. Includes order management and seller listings.",
    image: "./image/Screenshot_20260725_162756_rocoCoin.jpg"
  },
  {
    title: "NFT Marketplace",
    description: "Mint, list, buy and sell NFTs on the Base Sepolia network. View owned NFTs and manage listings.",
    image: "./image/Screenshot_20260725_162805_rocoCoin.jpg"
  },
 
 
  {
    title: "Settings - Account",
    description: "Edit user profile including name, username, bio, occupation, contact details and profile photo.",
    image: "./image/Screenshot_20260725_162823_rocoCoin.jpg"
  },
  {
    title: "Settings - Security",
    description: "Manage password, enable 2FA via authenticator app, view login history and active sessions.",
      image: "./image/Screenshot_20260725_162830_rocoCoin.jpg"
  },
  {
    title: "Settings - Notifications",
    description: "Configure notification channels (Email, SMS, Push) and notification preferences.",
    image: "./image/Screenshot_20260725_162837_rocoCoin.jpg"
  },

  {
    title: "Support Chat",
    description: "Real-time chat with customer support team.",
    image: "./image/Screenshot_20260725_162855_Chrome.jpg"
  },
 
]
    // Render screens dynamically
    const container = document.getElementById("screens");
    screens.forEach((screen, index) => {
      const div = document.createElement("div");
      div.className = "screen";
      div.innerHTML = `
        <div class="number">Screen ${index + 1}</div>
        <h2>${screen.title}</h2>
        <p>${screen.description}</p>
        <img src="${screen.image}" alt="${screen.title}">
      `;
      container.appendChild(div);
    });
  </script>
</body>
</html>
